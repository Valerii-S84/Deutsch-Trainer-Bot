[build-system]
requires = ["setuptools>=69.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deutsch-trainer-bot"
version = "0.1.0"
description = "Production foundation for Telegram quiz bot"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.4.1",
  "httpx>=0.28.0",
  "redis>=5.0.4",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13.2",
  "asyncpg>=0.29.0",
  "pydantic-settings>=2.3.4",
  "pydantic>=2.7.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.2",
  "pytest-asyncio>=0.23.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
package-dir = {"" = "."}
