[build-system]
requires = ["setuptools>=69.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deutsch-trainer-bot"
version = "0.1.0"
description = "Production foundation for Telegram quiz bot"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.4.1",
  "httpx>=0.28.0",
  "redis>=5.0.4",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13.2",
  "asyncpg>=0.29.0",
  "pydantic-settings>=2.14.2",
  "pydantic>=2.7.4",
  "msgpack>=1.2.1",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.2",
  "pytest-asyncio>=0.23.7",
  "aiosqlite>=0.20.0",
  "coverage[toml]>=7.6.0",
  "pytest-cov>=5.0.0",
  "bandit>=1.7.9",
  "pip-audit>=2.7.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "asyncio: marks tests using asyncio event loop",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 76
precision = 2
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
