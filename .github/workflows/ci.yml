name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deutsch_trainer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d deutsch_trainer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/deutsch_trainer
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/deutsch_trainer
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: German-only Telegram UI guard
        run: python -m pytest -q --capture=no tests/test_german_copy.py

      - name: Milestone 13 QA release gates
        run: python scripts/qa_release_gates.py --environment ci --evidence-file qa_evidence/ci_release_gates.json

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-release-evidence
          path: |
            qa_evidence/ci_release_gates.json
            .coverage
          if-no-files-found: ignore
