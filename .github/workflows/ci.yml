name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: German-only Telegram UI guard
        run: python -m pytest -q --capture=no tests/test_german_copy.py

      - name: Milestone 13 QA release gates
        run: python scripts/qa_release_gates.py --environment ci --evidence-file qa_evidence/ci_release_gates.json

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-release-evidence
          path: qa_evidence/ci_release_gates.json
          if-no-files-found: ignore
