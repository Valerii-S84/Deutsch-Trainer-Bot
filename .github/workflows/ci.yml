name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall app tests

      - name: Static analysis policy
        run: python scripts/static_policy_check.py

      - name: Secret scan
        run: python scripts/secret_scan.py

      - name: Test
        run: python -m pytest -q --capture=no
