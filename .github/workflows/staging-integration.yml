name: Staging Integration Gates

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment containing protected staging secrets.
        required: true
        default: staging

jobs:
  staging-integration:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Write Telegram Stars evidence
        env:
          TELEGRAM_STARS_EVIDENCE_JSON: ${{ secrets.TELEGRAM_STARS_EVIDENCE_JSON }}
        run: |
          test -n "$TELEGRAM_STARS_EVIDENCE_JSON"
          mkdir -p qa_evidence
          printf '%s' "$TELEGRAM_STARS_EVIDENCE_JSON" > qa_evidence/telegram_stars_sandbox.json

      - name: Run staging integration gates
        env:
          ALLOW_SYSTEM_PYTHON: "1"
          PYTHON_BIN: python
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          TEST_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          REDIS_URL: ${{ secrets.STAGING_REDIS_URL }}
          SMOKE_BASE_URL: ${{ secrets.STAGING_SMOKE_BASE_URL }}
          RUN_TELEGRAM_SMOKE: "1"
          RUN_QUIZ_BANK_SMOKE: "1"
          BOT_TOKEN: ${{ secrets.STAGING_BOT_TOKEN }}
          QUIZ_BANK_API_BASE_URL: ${{ secrets.STAGING_QUIZ_BANK_API_BASE_URL }}
          QUIZ_BANK_EDGE_API_KEY: ${{ secrets.STAGING_QUIZ_BANK_EDGE_API_KEY }}
          QUIZ_BANK_CONSUMER_ID: ${{ secrets.STAGING_QUIZ_BANK_CONSUMER_ID }}
          QUIZ_BANK_CONSUMER_API_KEY: ${{ secrets.STAGING_QUIZ_BANK_CONSUMER_API_KEY }}
          TELEGRAM_STARS_EVIDENCE_FILE: qa_evidence/telegram_stars_sandbox.json
        run: bash scripts/live_integration_gates.sh
