services:
  bot:
    image: ${BOT_IMAGE:?set immutable BOT_IMAGE}
    command:
      - python
      - -m
      - uvicorn
      - app.runtime.webhook_ingress_asgi:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --backlog
      - ${WEBHOOK_LISTEN_BACKLOG:-8192}
      - --loop
      - uvloop
      - --http
      - httptools
      - --no-access-log
      - --workers
      - ${WEBHOOK_INGRESS_UVICORN_WORKERS:-1}
    environment:
      APP_ENV: production
      APP_NAME: ${APP_NAME:-deutsch-trainer-bot}
      BOT_WEBHOOK_ENABLED: "True"
      BOT_POLLING_ENABLED: "False"
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:?set HTTPS public origin outside repo}
      TELEGRAM_WEBHOOK_PATH: ${TELEGRAM_WEBHOOK_PATH:-/telegram/webhook}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?set in protected secret storage}
      TELEGRAM_WEBHOOK_MAX_CONNECTIONS: ${TELEGRAM_WEBHOOK_MAX_CONNECTIONS:-40}
      TELEGRAM_DUPLICATE_UPDATE_TTL_SECONDS: ${TELEGRAM_DUPLICATE_UPDATE_TTL_SECONDS:-300}
      WEBHOOK_INGRESS_BACKEND: ${WEBHOOK_INGRESS_BACKEND:-redis_stream}
      WEBHOOK_INGRESS_STREAM_KEY: ${WEBHOOK_INGRESS_STREAM_KEY:-dtb:webhook_ingress:updates}
      WEBHOOK_INGRESS_GROUP_NAME: ${WEBHOOK_INGRESS_GROUP_NAME:-dtb-webhook-workers}
      WEBHOOK_INGRESS_DEAD_LETTER_KEY: ${WEBHOOK_INGRESS_DEAD_LETTER_KEY:-dtb:webhook_ingress:dead}
      WEBHOOK_INGRESS_DEDUPE_KEY_PREFIX: ${WEBHOOK_INGRESS_DEDUPE_KEY_PREFIX:-dtb:webhook_ingress:dedupe}
      WEBHOOK_INGRESS_METRICS_KEY_PREFIX: ${WEBHOOK_INGRESS_METRICS_KEY_PREFIX:-dtb:webhook_ingress:metrics}
      WEBHOOK_INGRESS_MAX_ATTEMPTS: ${WEBHOOK_INGRESS_MAX_ATTEMPTS:-5}
      WEBHOOK_INGRESS_ENQUEUE_BATCH_SIZE: ${WEBHOOK_INGRESS_ENQUEUE_BATCH_SIZE:-250}
      WEBHOOK_INGRESS_ENQUEUE_FLUSH_INTERVAL_MS: ${WEBHOOK_INGRESS_ENQUEUE_FLUSH_INTERVAL_MS:-2}
      WEBHOOK_INGRESS_QUEUE_LAG_UNHEALTHY_MS: ${WEBHOOK_INGRESS_QUEUE_LAG_UNHEALTHY_MS:-120000}
      REDIS_URL: ${REDIS_URL:?set in protected secret storage}
      REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-256}
      REDIS_POOL_TIMEOUT_SECONDS: ${REDIS_POOL_TIMEOUT_SECONDS:-2}
      REDIS_WARMUP_CONNECTIONS: ${REDIS_WARMUP_CONNECTIONS:-256}
      TRAINING_ANSWER_CACHE_ENABLED: ${TRAINING_ANSWER_CACHE_ENABLED:-True}
      TRAINING_ANSWER_CACHE_TTL_SECONDS: ${TRAINING_ANSWER_CACHE_TTL_SECONDS:-600}
      TRAINING_ANSWER_WRITE_BEHIND_ENABLED: ${TRAINING_ANSWER_WRITE_BEHIND_ENABLED:-True}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECURITY_RATE_LIMIT_ENABLED: "True"
      SECURITY_STATE_BACKEND: redis
      ANSWER_PERSIST_STREAM_KEY: ${ANSWER_PERSIST_STREAM_KEY:-dtb:answer_persist:events}
      ANSWER_PERSIST_DEAD_LETTER_KEY: ${ANSWER_PERSIST_DEAD_LETTER_KEY:-dtb:answer_persist:dead}
      ANSWER_PERSIST_METRICS_KEY_PREFIX: ${ANSWER_PERSIST_METRICS_KEY_PREFIX:-dtb:answer_persist:metrics}
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: ${WEBHOOK_INGRESS_REPLICAS:-2}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
      max-file: "5"

  webhook-worker:
    image: ${BOT_IMAGE:?set immutable BOT_IMAGE}
    command: ["python", "-m", "app.workers.run_webhook_ingress", "--without-answer-persistence"]
    environment:
      APP_ENV: production
      APP_NAME: ${APP_NAME:-deutsch-trainer-bot}
      BOT_TOKEN: ${BOT_TOKEN:?set in protected secret storage}
      BOT_FAKE_API_ENABLED: ${BOT_FAKE_API_ENABLED:-False}
      BOT_MAX_REQUEST_TIMEOUT: ${BOT_MAX_REQUEST_TIMEOUT:-30}
      DATABASE_URL: ${DATABASE_URL:?set in protected secret storage}
      DB_CONNECTION_BACKEND: ${DB_CONNECTION_BACKEND:-pgbouncer_transaction}
      DB_APP_REPLICA_COUNT: ${DB_APP_REPLICA_COUNT:-1}
      DB_WORKER_REPLICA_COUNT: ${DB_WORKER_REPLICA_COUNT:-4}
      DB_WORKER_CLIENT_BUDGET_PER_REPLICA: ${DB_WORKER_CLIENT_BUDGET_PER_REPLICA:-25}
      DB_PGBOUNCER_REUSE_APP_CONNECTIONS: ${DB_PGBOUNCER_REUSE_APP_CONNECTIONS:-False}
      DB_POOL_SIZE: ${WORKER_DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${WORKER_DB_MAX_OVERFLOW:-5}
      DB_POOL_TIMEOUT: ${WORKER_DB_POOL_TIMEOUT:-5}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      DB_POOL_PRE_PING: ${DB_POOL_PRE_PING:-True}
      WORKER_DB_POOL_SIZE: ${WORKER_DB_POOL_SIZE:-10}
      WORKER_DB_MAX_OVERFLOW: ${WORKER_DB_MAX_OVERFLOW:-5}
      WORKER_DB_POOL_TIMEOUT: ${WORKER_DB_POOL_TIMEOUT:-5}
      REDIS_URL: ${REDIS_URL:?set in protected secret storage}
      REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-256}
      REDIS_POOL_TIMEOUT_SECONDS: ${REDIS_POOL_TIMEOUT_SECONDS:-2}
      REDIS_WARMUP_CONNECTIONS: ${REDIS_WARMUP_CONNECTIONS:-256}
      WEBHOOK_INGRESS_BACKEND: ${WEBHOOK_INGRESS_BACKEND:-redis_stream}
      WEBHOOK_INGRESS_STREAM_KEY: ${WEBHOOK_INGRESS_STREAM_KEY:-dtb:webhook_ingress:updates}
      WEBHOOK_INGRESS_GROUP_NAME: ${WEBHOOK_INGRESS_GROUP_NAME:-dtb-webhook-workers}
      WEBHOOK_INGRESS_DEAD_LETTER_KEY: ${WEBHOOK_INGRESS_DEAD_LETTER_KEY:-dtb:webhook_ingress:dead}
      WEBHOOK_INGRESS_DEDUPE_KEY_PREFIX: ${WEBHOOK_INGRESS_DEDUPE_KEY_PREFIX:-dtb:webhook_ingress:dedupe}
      WEBHOOK_INGRESS_METRICS_KEY_PREFIX: ${WEBHOOK_INGRESS_METRICS_KEY_PREFIX:-dtb:webhook_ingress:metrics}
      WEBHOOK_INGRESS_MAX_ATTEMPTS: ${WEBHOOK_INGRESS_MAX_ATTEMPTS:-5}
      WEBHOOK_INGRESS_WORKER_BATCH_SIZE: ${WEBHOOK_INGRESS_WORKER_BATCH_SIZE:-50}
      WEBHOOK_INGRESS_WORKER_PARALLELISM: ${WEBHOOK_INGRESS_WORKER_PARALLELISM:-20}
      WEBHOOK_INGRESS_READ_BLOCK_MS: ${WEBHOOK_INGRESS_READ_BLOCK_MS:-1000}
      WEBHOOK_INGRESS_STALE_IDLE_MS: ${WEBHOOK_INGRESS_STALE_IDLE_MS:-60000}
      WEBHOOK_INGRESS_PROCESSING_LAG_SAMPLE_SIZE: ${WEBHOOK_INGRESS_PROCESSING_LAG_SAMPLE_SIZE:-10000}
      TRAINING_ANSWER_CACHE_ENABLED: ${TRAINING_ANSWER_CACHE_ENABLED:-True}
      TRAINING_ANSWER_CACHE_TTL_SECONDS: ${TRAINING_ANSWER_CACHE_TTL_SECONDS:-600}
      TRAINING_ANSWER_WRITE_BEHIND_ENABLED: ${TRAINING_ANSWER_WRITE_BEHIND_ENABLED:-True}
      ANSWER_PERSIST_STREAM_KEY: ${ANSWER_PERSIST_STREAM_KEY:-dtb:answer_persist:events}
      ANSWER_PERSIST_GROUP_NAME: ${ANSWER_PERSIST_GROUP_NAME:-dtb-answer-persist-workers}
      ANSWER_PERSIST_DEAD_LETTER_KEY: ${ANSWER_PERSIST_DEAD_LETTER_KEY:-dtb:answer_persist:dead}
      ANSWER_PERSIST_EVENT_KEY_PREFIX: ${ANSWER_PERSIST_EVENT_KEY_PREFIX:-dtb:answer_persist:event}
      ANSWER_PERSIST_QUESTION_KEY_PREFIX: ${ANSWER_PERSIST_QUESTION_KEY_PREFIX:-dtb:answer_persist:question}
      ANSWER_PERSIST_RESULT_KEY_PREFIX: ${ANSWER_PERSIST_RESULT_KEY_PREFIX:-dtb:answer_persist:result}
      ANSWER_PERSIST_METRICS_KEY_PREFIX: ${ANSWER_PERSIST_METRICS_KEY_PREFIX:-dtb:answer_persist:metrics}
      ANSWER_PERSIST_BATCH_SIZE: ${ANSWER_PERSIST_BATCH_SIZE:-250}
      ANSWER_PERSIST_FLUSH_INTERVAL_MS: ${ANSWER_PERSIST_FLUSH_INTERVAL_MS:-50}
      ANSWER_PERSIST_MAX_ATTEMPTS: ${ANSWER_PERSIST_MAX_ATTEMPTS:-5}
      ANSWER_PERSIST_STALE_IDLE_MS: ${ANSWER_PERSIST_STALE_IDLE_MS:-60000}
      ANSWER_PERSIST_PROCESSING_LAG_SAMPLE_SIZE: ${ANSWER_PERSIST_PROCESSING_LAG_SAMPLE_SIZE:-10000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECURITY_RATE_LIMIT_ENABLED: "True"
      SECURITY_STATE_BACKEND: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: ${WEBHOOK_WORKER_REPLICAS:-2}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  answer-persistence-worker:
    image: ${BOT_IMAGE:?set immutable BOT_IMAGE}
    command: ["python", "-m", "app.workers.run_answer_persistence"]
    environment:
      APP_ENV: production
      APP_NAME: ${APP_NAME:-deutsch-trainer-bot}
      DATABASE_URL: ${DATABASE_URL:?set in protected secret storage}
      DB_CONNECTION_BACKEND: ${DB_CONNECTION_BACKEND:-pgbouncer_transaction}
      DB_APP_REPLICA_COUNT: ${DB_APP_REPLICA_COUNT:-1}
      DB_WORKER_REPLICA_COUNT: ${DB_WORKER_REPLICA_COUNT:-4}
      DB_WORKER_CLIENT_BUDGET_PER_REPLICA: ${DB_WORKER_CLIENT_BUDGET_PER_REPLICA:-25}
      DB_PGBOUNCER_REUSE_APP_CONNECTIONS: ${DB_PGBOUNCER_REUSE_APP_CONNECTIONS:-False}
      DB_POOL_SIZE: ${WORKER_DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${WORKER_DB_MAX_OVERFLOW:-5}
      DB_POOL_TIMEOUT: ${WORKER_DB_POOL_TIMEOUT:-5}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      DB_POOL_PRE_PING: ${DB_POOL_PRE_PING:-True}
      WORKER_DB_POOL_SIZE: ${WORKER_DB_POOL_SIZE:-10}
      WORKER_DB_MAX_OVERFLOW: ${WORKER_DB_MAX_OVERFLOW:-5}
      WORKER_DB_POOL_TIMEOUT: ${WORKER_DB_POOL_TIMEOUT:-5}
      REDIS_URL: ${REDIS_URL:?set in protected secret storage}
      REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-256}
      REDIS_POOL_TIMEOUT_SECONDS: ${REDIS_POOL_TIMEOUT_SECONDS:-2}
      REDIS_WARMUP_CONNECTIONS: ${REDIS_WARMUP_CONNECTIONS:-256}
      TRAINING_ANSWER_CACHE_ENABLED: ${TRAINING_ANSWER_CACHE_ENABLED:-True}
      TRAINING_ANSWER_CACHE_TTL_SECONDS: ${TRAINING_ANSWER_CACHE_TTL_SECONDS:-600}
      TRAINING_ANSWER_WRITE_BEHIND_ENABLED: ${TRAINING_ANSWER_WRITE_BEHIND_ENABLED:-True}
      ANSWER_PERSIST_STREAM_KEY: ${ANSWER_PERSIST_STREAM_KEY:-dtb:answer_persist:events}
      ANSWER_PERSIST_GROUP_NAME: ${ANSWER_PERSIST_GROUP_NAME:-dtb-answer-persist-workers}
      ANSWER_PERSIST_DEAD_LETTER_KEY: ${ANSWER_PERSIST_DEAD_LETTER_KEY:-dtb:answer_persist:dead}
      ANSWER_PERSIST_EVENT_KEY_PREFIX: ${ANSWER_PERSIST_EVENT_KEY_PREFIX:-dtb:answer_persist:event}
      ANSWER_PERSIST_QUESTION_KEY_PREFIX: ${ANSWER_PERSIST_QUESTION_KEY_PREFIX:-dtb:answer_persist:question}
      ANSWER_PERSIST_RESULT_KEY_PREFIX: ${ANSWER_PERSIST_RESULT_KEY_PREFIX:-dtb:answer_persist:result}
      ANSWER_PERSIST_METRICS_KEY_PREFIX: ${ANSWER_PERSIST_METRICS_KEY_PREFIX:-dtb:answer_persist:metrics}
      ANSWER_PERSIST_BATCH_SIZE: ${ANSWER_PERSIST_BATCH_SIZE:-250}
      ANSWER_PERSIST_FLUSH_INTERVAL_MS: ${ANSWER_PERSIST_FLUSH_INTERVAL_MS:-50}
      ANSWER_PERSIST_MAX_ATTEMPTS: ${ANSWER_PERSIST_MAX_ATTEMPTS:-5}
      ANSWER_PERSIST_STALE_IDLE_MS: ${ANSWER_PERSIST_STALE_IDLE_MS:-60000}
      ANSWER_PERSIST_PROCESSING_LAG_SAMPLE_SIZE: ${ANSWER_PERSIST_PROCESSING_LAG_SAMPLE_SIZE:-10000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECURITY_RATE_LIMIT_ENABLED: "True"
      SECURITY_STATE_BACKEND: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: ${ANSWER_PERSIST_WORKER_REPLICAS:-2}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  worker:
    image: ${BOT_IMAGE:?set immutable BOT_IMAGE}
    command: ["python", "-m", "app.workers.run_outbox"]
    environment:
      APP_ENV: production
      APP_NAME: ${APP_NAME:-deutsch-trainer-bot}
      DATABASE_URL: ${DATABASE_URL:?set in protected secret storage}
      DB_CONNECTION_BACKEND: ${DB_CONNECTION_BACKEND:-pgbouncer_transaction}
      DB_APP_REPLICA_COUNT: ${DB_APP_REPLICA_COUNT:-1}
      DB_WORKER_REPLICA_COUNT: ${DB_WORKER_REPLICA_COUNT:-4}
      DB_WORKER_CLIENT_BUDGET_PER_REPLICA: ${DB_WORKER_CLIENT_BUDGET_PER_REPLICA:-25}
      DB_PGBOUNCER_REUSE_APP_CONNECTIONS: ${DB_PGBOUNCER_REUSE_APP_CONNECTIONS:-False}
      DB_POOL_SIZE: ${WORKER_DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${WORKER_DB_MAX_OVERFLOW:-5}
      DB_POOL_TIMEOUT: ${WORKER_DB_POOL_TIMEOUT:-5}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      DB_POOL_PRE_PING: ${DB_POOL_PRE_PING:-True}
      WORKER_DB_POOL_SIZE: ${WORKER_DB_POOL_SIZE:-10}
      WORKER_DB_MAX_OVERFLOW: ${WORKER_DB_MAX_OVERFLOW:-5}
      WORKER_DB_POOL_TIMEOUT: ${WORKER_DB_POOL_TIMEOUT:-5}
      REDIS_URL: ${REDIS_URL:?set in protected secret storage}
      REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-256}
      REDIS_POOL_TIMEOUT_SECONDS: ${REDIS_POOL_TIMEOUT_SECONDS:-2}
      WEBHOOK_INGRESS_BACKEND: ${WEBHOOK_INGRESS_BACKEND:-redis_stream}
      TRAINING_ANSWER_CACHE_ENABLED: ${TRAINING_ANSWER_CACHE_ENABLED:-True}
      TRAINING_ANSWER_CACHE_TTL_SECONDS: ${TRAINING_ANSWER_CACHE_TTL_SECONDS:-600}
      TRAINING_ANSWER_WRITE_BEHIND_ENABLED: ${TRAINING_ANSWER_WRITE_BEHIND_ENABLED:-True}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECURITY_RATE_LIMIT_ENABLED: "True"
      SECURITY_STATE_BACKEND: redis
    depends_on:
      db:
        condition: service_healthy
    deploy:
      replicas: ${OUTBOX_WORKER_REPLICAS:-2}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set database user outside repo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in protected secret storage}
      POSTGRES_DB: ${POSTGRES_DB:-deutsch_trainer}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?set deployment domain outside repo}
      ACME_EMAIL: ${ACME_EMAIL:?set operator email outside repo}
      TELEGRAM_WEBHOOK_PATH: ${TELEGRAM_WEBHOOK_PATH:-/telegram/webhook}
    volumes:
      - ./deploy/Caddyfile.production.template:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      bot:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
